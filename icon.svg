<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background square with smooth rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer subtle glowing ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="#374151" stroke-width="6"/>

  <!-- Main glowing badge -->
  <circle cx="256" cy="256" r="160" fill="url(#accent)" filter="url(#shadow)"/>

  <!-- Stylized Ticket / Mic icon -->
  <!-- Ticket shape -->
  <path d="M 170 180 C 170 170, 178 162, 188 162 L 324 162 C 334 162, 342 170, 342 180 L 342 225 C 330 225, 320 235, 320 247 C 320 259, 330 269, 342 269 L 342 332 C 342 342, 334 350, 324 350 L 188 350 C 178 350, 170 342, 170 332 L 170 269 C 182 269, 192 259, 192 247 C 192 235, 182 225, 170 225 Z" fill="#ffffff" filter="url(#shadow)"/>
  
  <!-- Microphone head inside ticket -->
  <rect x="238" y="200" width="36" height="58" rx="18" fill="#1d4ed8"/>
  <path d="M 226 232 C 226 254, 286 254, 286 232" fill="none" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="262" x2="256" y2="282" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>
  <line x1="240" y1="282" x2="272" y2="282" stroke="#1d4ed8" stroke-width="8" stroke-linecap="round"/>

  <!-- Ticket dots / notch indicator line -->
  <line x1="205" y1="312" x2="307" y2="312" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 8"/>

  <!-- Online / Recording active status dot -->
  <circle cx="380" cy="132" r="32" fill="#22c55e" stroke="#111827" stroke-width="8"/>
</svg>
